name: Trusted workflow contract

on:
  pull_request_target:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-workflow-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-workflow-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out base-owned policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Fetch candidate files as inert data
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const pull = context.payload.pull_request;
            const files = [
              ["candidate-check.yml", ".github/workflows/check.yml"],
              ["candidate-trusted-workflow-contract.yml", ".github/workflows/trusted-workflow-contract.yml"],
              ["candidate-trusted-workflow-contract.py", "scripts/trusted_workflow_contract.py"],
            ];
            for (const [destination, repositoryPath] of files) {
              const response = await github.rest.repos.getContent({
                owner: pull.head.repo.owner.login,
                repo: pull.head.repo.name,
                path: repositoryPath,
                ref: pull.head.sha,
              });
              if (Array.isArray(response.data) || response.data.type !== "file" || !response.data.content) {
                core.setFailed(`${repositoryPath} is not a readable candidate file`);
                return;
              }
              fs.writeFileSync(
                path.join(process.env.RUNNER_TEMP, destination),
                Buffer.from(response.data.content, "base64"),
              );
            }
      - name: Validate candidate against base-owned policy
        run: >-
          /usr/bin/python3 -I -B scripts/trusted_workflow_contract.py
          "$RUNNER_TEMP/candidate-check.yml"
          "$RUNNER_TEMP/candidate-trusted-workflow-contract.yml"
          "$RUNNER_TEMP/candidate-trusted-workflow-contract.py"
